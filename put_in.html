<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAPPA BOLLE — Gestione Interventi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0f1c2e;
            --navy-mid: #1a2f47;
            --navy-light: #243d58;
            --navy-border: #2e4d6b;
            --accent: #1a7fd4;
            --accent-hover: #1569b8;
            --accent-light: #e8f4fd;
            --success: #0d7a52;
            --success-bg: #d4f0e6;
            --warning: #b45309;
            --warning-bg: #fef3c7;
            --danger: #b91c1c;
            --danger-bg: #fee2e2;
            --purple: #6d28d9;
            --purple-bg: #ede9fe;
            --surface: #ffffff;
            --surface-2: #f7f9fc;
            --surface-3: #eef2f7;
            --border: #d1dce9;
            --border-light: #e8eef5;
            --text-primary: #0f1c2e;
            --text-secondary: #4a6280;
            --text-muted: #8aa0b8;
            --font: 'IBM Plex Sans', sans-serif;
            --mono: 'IBM Plex Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--surface-2);
            color: var(--text-primary);
        }

        .topbar {
            background: var(--navy);
            padding: 0 20px;
            height: 52px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--navy-border);
        }

        .topbar-brand { display: flex; align-items: center; gap: 10px; margin-right: 8px; }
        .brand-logo {
            width: 28px; height: 28px;
            background: var(--accent);
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; color: white; font-weight: 700;
            font-family: var(--mono); flex-shrink: 0;
        }
        .brand-name { font-size: 0.95rem; font-weight: 700; color: white; letter-spacing: 0.5px; }
        .topbar-divider { width: 1px; height: 24px; background: var(--navy-border); flex-shrink: 0; }
        .topbar-btn {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 6px 14px; border-radius: 5px; border: none;
            font-family: var(--font); font-size: 0.82rem; font-weight: 500;
            cursor: pointer; transition: all 0.15s; white-space: nowrap;
        }
        .btn-upload { background: var(--accent); color: white; }
        .btn-upload:hover { background: var(--accent-hover); }
        .btn-export { background: var(--navy-light); color: #c8d8e8; border: 1px solid var(--navy-border); }
        .btn-export:hover:not(:disabled) { background: var(--navy-border); color: white; }
        .btn-export:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-stats { background: transparent; color: #c8d8e8; border: 1px solid var(--navy-border); }
        .btn-stats:hover:not(:disabled) { background: var(--navy-light); color: white; }
        .btn-stats:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-auto { background: var(--navy-light); color: #5ce0a8; border: 1px solid var(--navy-border); }
        .btn-auto:hover { background: var(--navy-border); color: white; }
        .btn-auto.paused { color: #fca5a5; border-color: rgba(185,28,28,0.4); }
        .btn-popup { background: var(--navy-light); color: #c8d8e8; border: 1px solid var(--navy-border); }
        .btn-popup:hover { background: var(--navy-border); color: white; }

        #fileInput { display: none; }
        .sheet-selector-wrap { display: none; align-items: center; gap: 8px; }
        .sheet-selector-wrap label { font-size: 0.78rem; color: var(--text-muted); }
        .sheet-selector-wrap select {
            padding: 5px 10px; border-radius: 5px;
            border: 1px solid var(--navy-border);
            background: var(--navy-light); color: white;
            font-family: var(--font); font-size: 0.82rem;
        }
        .topbar-status { margin-left: auto; display: flex; align-items: center; gap: 10px; }
        .status-pill {
            padding: 4px 12px; border-radius: 20px;
            font-size: 0.75rem; font-weight: 500;
            background: var(--navy-light); color: var(--text-muted);
            border: 1px solid var(--navy-border); transition: all 0.3s;
        }
        .status-pill.success { background: rgba(13,122,82,0.25); color: #5ce0a8; border-color: rgba(13,122,82,0.4); }
        .status-pill.error   { background: rgba(185,28,28,0.25); color: #fca5a5; border-color: rgba(185,28,28,0.4); }
        .status-pill.loading { background: rgba(26,127,212,0.25); color: #93c5fd; border-color: rgba(26,127,212,0.4); }
        .status-pill.warning { background: rgba(180,83,9,0.25); color: #fcd34d; border-color: rgba(180,83,9,0.4); }

        .main-container { display: flex; flex: 1; overflow: hidden; }

        .filters-column {
            width: 260px; min-width: 260px;
            background: var(--navy); color: white;
            display: flex; flex-direction: column;
            border-right: 1px solid var(--navy-border);
            flex-shrink: 0; overflow: hidden;
        }
        .filters-header { padding: 14px 16px 10px; border-bottom: 1px solid var(--navy-border); flex-shrink: 0; }
        .filters-header .sidebar-title { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .filters-header .sidebar-month { font-size: 1.15rem; font-weight: 700; color: white; letter-spacing: -0.3px; }
        .filters-header .job-count-row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
        .filters-header .job-count-badge { font-size: 0.72rem; background: var(--navy-light); color: #8ab4d4; padding: 3px 8px; border-radius: 10px; font-family: var(--mono); }
        .filters-scroll { flex: 1; overflow-y: auto; padding: 12px 16px; }
        .filters-scroll .filter-row { margin-bottom: 10px; }
        .filters-scroll .filter-row:last-child { margin-bottom: 0; }
        .filters-scroll .filter-label { font-size: 0.67rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-muted); margin-bottom: 4px; display: block; }
        .filters-scroll .filter-select, .filters-scroll .filter-input {
            width: 100%; padding: 6px 9px; border-radius: 4px;
            border: 1px solid var(--navy-border); background: var(--navy-light);
            color: white; font-family: var(--font); font-size: 0.8rem;
        }
        .filters-scroll .filter-select option { background: var(--navy-mid); }
        .filters-scroll .filter-input::placeholder { color: #5a7a96; }
        .filters-scroll .filter-checkbox-row { display: flex; align-items: center; gap: 7px; }
        .filters-scroll .filter-checkbox-row input[type="checkbox"] { width: 14px; height: 14px; accent-color: var(--accent); }
        .filters-scroll .filter-checkbox-row label { font-size: 0.78rem; color: #a0b8cc; cursor: pointer; }
        .filters-scroll .reset-btn {
            width: 100%; padding: 6px; margin-top: 8px;
            background: transparent; border: 1px solid var(--navy-border);
            color: #8aa4bc; border-radius: 4px;
            font-family: var(--font); font-size: 0.78rem;
            cursor: pointer; transition: all 0.15s;
        }
        .filters-scroll .reset-btn:hover { background: var(--navy-light); color: white; }
        .filter-divider { border: none; border-top: 1px solid var(--navy-border); margin: 12px 0; }

        .list-column {
            width: 27%; min-width: 320px;
            background: var(--navy-mid);
            display: flex; flex-direction: column;
            border-right: 1px solid var(--navy-border);
            overflow: hidden;
        }
        .list-header {
            padding: 10px 14px; border-bottom: 1px solid var(--navy-border);
            flex-shrink: 0; display: flex; align-items: center;
            justify-content: space-between; background: var(--navy);
        }
        .list-header-title { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; }
        .list-header-count { font-size: 0.72rem; color: #8ab4d4; font-family: var(--mono); }
        .jobs-list-container { flex: 1; overflow-y: auto; padding: 6px 8px; }

        .job-card {
            background: var(--navy-light); border: 1px solid transparent;
            border-radius: 5px; padding: 8px 10px; margin-bottom: 4px;
            cursor: pointer; transition: all 0.15s; position: relative;
        }
        .job-card:hover { background: var(--navy-border); border-color: var(--navy-border); }
        .job-card.active { background: var(--accent); border-color: var(--accent-hover); }
        .job-card.active .job-card-addr, .job-card.active .job-card-badge, .job-card.active .job-card-price { color: rgba(255,255,255,0.8); background: rgba(255,255,255,0.15); }
        .job-card.active .job-card-price { color: rgba(255,255,255,0.9); }
        .job-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
        .job-card-code { font-size: 0.8rem; font-weight: 600; font-family: var(--mono); color: white; }
        .job-card-right { display: flex; align-items: center; gap: 8px; font-size: 0.7rem; }
        .job-card-count { color: rgba(255,255,255,0.5); font-family: var(--mono); }
        .job-card-price { color: var(--text-muted); font-family: var(--mono); font-size: 0.72rem; font-weight: 500; }
        .job-card-addr { font-size: 0.7rem; color: #8aa4bc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .job-card-badges { display: flex; flex-wrap: wrap; gap: 3px; }
        .job-card-badge { font-size: 0.6rem; padding: 1px 6px; border-radius: 8px; background: rgba(255,255,255,0.08); color: #8aa4bc; font-weight: 500; }
        .job-check-dot {
            position: absolute; top: 8px; right: 8px;
            width: 7px; height: 7px; border-radius: 50%;
            background: #0d7a52; box-shadow: 0 0 0 2px rgba(13,122,82,0.25);
        }
        .job-check-dot.nt { background: #b91c1c; box-shadow: 0 0 0 2px rgba(185,28,28,0.25); }
        .job-check-dot.dv { background: #b45309; box-shadow: 0 0 0 2px rgba(180,83,9,0.25); }

        .detail-column { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-2); }
        .detail-header {
            background: var(--surface); padding: 10px 20px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            flex-shrink: 0; flex-wrap: wrap; gap: 8px;
        }
        .detail-header-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .nav-btn {
            width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            background: none; border: 1px solid var(--border);
            border-radius: 50%; cursor: pointer;
            color: var(--text-secondary); font-size: 0.85rem; transition: all 0.15s;
        }
        .nav-btn:hover:not(:disabled) { background: var(--surface-3); border-color: var(--border); }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .detail-job-title { font-size: 1rem; font-weight: 400; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; }
        .detail-job-title strong { font-weight: 700; color: var(--accent); font-family: var(--mono); }
        .job-status-badge {
            font-size: 0.65rem; font-weight: 600; padding: 2px 10px;
            border-radius: 12px; text-transform: uppercase; letter-spacing: 0.5px;
            font-family: var(--mono); background: var(--surface-3);
            color: var(--text-muted); border: 1px solid var(--border);
        }
        .job-status-badge.ok { background: var(--success-bg); color: var(--success); border-color: #6ee7b7; }
        .job-status-badge.nt { background: var(--danger-bg); color: var(--danger); border-color: #fca5a5; }
        .job-status-badge.dv { background: var(--warning-bg); color: var(--warning); border-color: #fde68a; }
        .detail-header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .worktype-tag {
            padding: 4px 12px; border-radius: 20px;
            font-size: 0.75rem; font-weight: 500;
            background: var(--surface-3); color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .register-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 14px; border-radius: 20px;
            border: 1px solid var(--border);
            font-family: var(--font); font-size: 0.8rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
            background: var(--surface-2); color: var(--text-secondary);
        }
        .register-btn:hover:not(.active) { background: var(--surface-3); }
        .register-btn.active.ok { background: var(--success-bg); color: var(--success); border-color: #6ee7b7; }
        .register-btn.active.ok:hover { background: #a7f3d0; }
        .register-btn.active.nt { background: var(--danger-bg); color: var(--danger); border-color: #fca5a5; }
        .register-btn.active.nt:hover { background: #fecaca; }
        .register-btn.active.dv { background: var(--warning-bg); color: var(--warning); border-color: #fde68a; }
        .register-btn.active.dv:hover { background: #fde68a; }

        .detail-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
        .empty-state {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100%; gap: 12px;
            color: var(--text-muted);
        }
        .empty-state-icon {
            width: 56px; height: 56px; background: var(--surface-3);
            border-radius: 14px; display: flex; align-items: center;
            justify-content: center; font-size: 24px;
        }
        .empty-state h3 { font-size: 0.95rem; font-weight: 600; color: var(--text-secondary); }
        .empty-state p { font-size: 0.82rem; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: 8px; margin-bottom: 12px; overflow: hidden;
        }
        .card-header {
            padding: 10px 14px; border-bottom: 1px solid var(--border-light);
            display: flex; align-items: center; justify-content: space-between;
            background: var(--surface-2);
        }
        .card-title {
            font-size: 0.72rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.8px;
            color: var(--text-secondary);
            display: flex; align-items: center; gap: 7px;
        }
        .card-title-icon {
            width: 18px; height: 18px; background: var(--accent-light);
            border-radius: 4px; display: flex; align-items: center;
            justify-content: center; font-size: 10px;
        }
        .card-body { padding: 14px; }

        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .info-item.full { grid-column: span 2; }
        .info-label { font-size: 0.63rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 3px; }
        .info-value {
            font-size: 0.82rem; color: var(--text-primary); font-weight: 500;
            background: var(--surface-2); border: 1px solid var(--border-light);
            padding: 5px 8px; border-radius: 4px; word-break: break-word;
        }

        .highlight-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .highlight-card {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--surface); border: 1px solid var(--border-light);
            border-radius: 6px; padding: 7px 12px; flex: 1; min-width: 140px;
        }
        .highlight-label { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
        .highlight-value { font-size: 0.9rem; font-weight: 700; }
        .highlight-value.blue { color: var(--accent); }
        .highlight-value.purple { color: var(--purple); }

        .work-chip {
            display: inline-flex; align-items: center;
            padding: 3px 10px; border-radius: 14px;
            font-size: 0.75rem; font-weight: 500;
            border: 1px solid var(--border); margin: 2px;
        }

        .xy-card { border-left: 3px solid var(--accent); }
        .xy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .xy-value {
            background: #fffbeb; border: 1px solid #fde68a;
            color: #92400e; font-weight: 600;
        }

        .task-item {
            background: var(--surface-2);
            border: 1px solid var(--border-light);
            border-left: 3px solid var(--accent);
            border-radius: 5px; padding: 11px 12px; margin-bottom: 10px;
        }
        .task-item:last-child { margin-bottom: 0; }
        .task-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .task-component { font-size: 0.8rem; font-weight: 600; color: var(--accent); }
        .task-employee { font-size: 0.72rem; color: var(--text-muted); font-family: var(--mono); }
        .task-desc { font-size: 0.8rem; color: var(--text-secondary); line-height: 1.5; margin-bottom: 8px; white-space: pre-wrap; }
        .task-footer { display: flex; justify-content: space-between; align-items: center; }
        .task-qty { font-size: 0.72rem; color: var(--text-muted); }
        .task-cost { font-size: 0.82rem; font-weight: 700; color: var(--success); font-family: var(--mono); }
        .task-xy-tag {
            margin-top: 6px; font-size: 0.72rem;
            color: #92400e; background: #fffbeb;
            border: 1px solid #fde68a; padding: 3px 8px;
            border-radius: 4px; font-family: var(--mono);
        }

        .total-cost-bar {
            background: var(--navy); color: white;
            padding: 10px 14px; border-radius: 5px;
            margin-top: 12px; display: flex;
            align-items: center; justify-content: space-between;
            font-size: 0.82rem;
        }
        .total-cost-bar .amount { font-size: 1.05rem; font-weight: 700; font-family: var(--mono); }

        .copy-badge {
            display: inline-flex; align-items: center; gap: 5px;
            background: var(--accent-light); color: var(--accent);
            border: 1px solid #bfdbfe; padding: 3px 10px;
            border-radius: 12px; font-size: 0.75rem;
            cursor: pointer; transition: all 0.15s;
        }
        .copy-badge:hover { background: var(--accent); color: white; }

        .note-footer {
            margin-top: 10px; padding-top: 10px;
            border-top: 1px solid var(--border-light);
            font-size: 0.78rem; color: var(--text-muted);
        }

        .toast {
            position: fixed; bottom: 24px; right: 24px;
            padding: 10px 18px; border-radius: 6px;
            font-size: 0.85rem; font-weight: 500;
            box-shadow: 0 8px 24px rgba(0,0,0,0.18);
            z-index: 9999; opacity: 0;
            transform: translateY(8px);
            transition: all 0.25s; pointer-events: none;
            background: var(--navy); color: white;
            display: flex; align-items: center; gap: 8px;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background: #0d4a2f; border-left: 3px solid #0d7a52; }
        .toast.error   { background: #4a0d0d; border-left: 3px solid #b91c1c; }
        .toast.warning { background: #4a3a0d; border-left: 3px solid #b45309; }
        .toast.info    { background: #0d2a4a; border-left: 3px solid var(--accent); }

        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(10,18,30,0.7);
            display: flex; align-items: center; justify-content: center;
            z-index: 5000; backdrop-filter: blur(3px);
        }
        .modal-box {
            background: var(--surface); border-radius: 10px;
            width: 92%; max-width: 1100px; max-height: 88vh;
            display: flex; flex-direction: column;
            box-shadow: 0 24px 60px rgba(0,0,0,0.35);
            overflow: hidden; border: 1px solid var(--border);
        }
        .modal-head {
            background: var(--navy); padding: 16px 24px;
            display: flex; align-items: center; justify-content: space-between;
            flex-shrink: 0;
        }
        .modal-head h2 { font-size: 1rem; font-weight: 700; color: white; display: flex; align-items: center; gap: 10px; }
        .modal-close-x { background: none; border: none; color: #8aa4bc; font-size: 1.4rem; cursor: pointer; line-height: 1; transition: color 0.15s; }
        .modal-close-x:hover { color: white; }
        .modal-body { overflow-y: auto; padding: 24px; flex: 1; }
        .modal-foot {
            background: var(--surface-2); padding: 12px 24px;
            border-top: 1px solid var(--border);
            display: flex; align-items: center; gap: 8px;
            justify-content: flex-end; flex-shrink: 0; flex-wrap: wrap;
        }
        .modal-btn {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 7px 16px; border-radius: 5px; border: none;
            font-family: var(--font); font-size: 0.82rem; font-weight: 500;
            cursor: pointer; transition: all 0.15s;
        }
        .modal-btn-pdf  { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
        .modal-btn-pdf:hover  { background: #fecaca; }
        .modal-btn-xlsx { background: var(--success-bg); color: var(--success); border: 1px solid #6ee7b7; }
        .modal-btn-xlsx:hover { background: #a7f3d0; }
        .modal-btn-missing { background: var(--warning-bg); color: var(--warning); border: 1px solid #fde68a; }
        .modal-btn-missing:hover { background: #fde68a; }
        .modal-btn-close { background: var(--surface-3); color: var(--text-secondary); border: 1px solid var(--border); }
        .modal-btn-close:hover { background: var(--border); }

        .stats-section { margin-bottom: 28px; }
        .stats-section-title {
            font-size: 0.72rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-muted); margin-bottom: 12px;
            padding-bottom: 8px; border-bottom: 1px solid var(--border-light);
            display: flex; align-items: center; gap: 8px;
        }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
        .kpi-card { background: var(--surface-2); border: 1px solid var(--border-light); border-radius: 7px; padding: 14px; text-align: center; }
        .kpi-label { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 6px; }
        .kpi-value { font-size: 1.45rem; font-weight: 700; color: var(--text-primary); font-family: var(--mono); line-height: 1.1; }
        .kpi-value.accent { color: var(--accent); }
        .kpi-value.success { color: var(--success); }
        .kpi-value.danger  { color: var(--danger); }
        .kpi-value.warning { color: var(--warning); }
        .kpi-sub { font-size: 0.72rem; color: var(--text-muted); margin-top: 4px; }
        .progress-track { height: 4px; background: var(--border-light); border-radius: 2px; margin-top: 8px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.6s ease; }

        .stats-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        .stats-table th {
            text-align: left; padding: 8px 12px; background: var(--surface-3);
            color: var(--text-secondary); font-size: 0.68rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
        }
        .stats-table td { padding: 8px 12px; border-bottom: 1px solid var(--border-light); color: var(--text-primary); }
        .stats-table tr:last-child td { border-bottom: none; }
        .stats-table tr:hover td { background: var(--surface-3); }
        .stats-table .tr { text-align: right; font-family: var(--mono); }

        .missing-list { max-height: 280px; overflow-y: auto; border: 1px solid var(--border-light); border-radius: 6px; }
        .missing-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--border-light); }
        .missing-item:last-child { border-bottom: none; }
        .missing-item:hover { background: var(--surface-3); }
        .missing-item-job { font-weight: 600; color: var(--accent); font-family: var(--mono); font-size: 0.82rem; }
        .missing-item-detail { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
        .missing-item-cost { font-weight: 700; color: var(--success); font-family: var(--mono); font-size: 0.82rem; }
        .missing-total { background: var(--surface-3); padding: 10px 14px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 0.82rem; font-weight: 600; color: var(--text-primary); }
        .missing-total span:last-child { font-family: var(--mono); color: var(--danger); }

        .status-breakdown { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 16px; }
        .status-item { background: var(--surface-2); border: 1px solid var(--border-light); border-radius: 6px; padding: 10px 12px; text-align: center; }
        .status-item .label { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
        .status-item .value { font-size: 1.1rem; font-weight: 700; font-family: var(--mono); margin-top: 4px; }
        .status-item .value.ok { color: var(--success); }
        .status-item .value.nt { color: var(--danger); }
        .status-item .value.dv { color: var(--warning); }
        .status-item .value.empty { color: var(--text-muted); }

        .note-modal-overlay {
            position: fixed; inset: 0;
            background: rgba(10,18,30,0.55);
            display: flex; align-items: center; justify-content: center;
            z-index: 6000; backdrop-filter: blur(2px);
            animation: fadeIn 0.18s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .note-modal-box {
            background: var(--surface); border-radius: 10px;
            width: 92%; max-width: 460px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border: 1px solid var(--border); overflow: hidden;
            animation: slideUp 0.2s ease;
        }
        @keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .note-modal-head { background: var(--navy); padding: 13px 18px; display: flex; align-items: center; justify-content: space-between; }
        .note-modal-head h3 { font-size: 0.88rem; font-weight: 700; color: white; display: flex; align-items: center; gap: 8px; }
        .note-modal-close { background: none; border: none; color: #8aa4bc; font-size: 1.3rem; cursor: pointer; line-height: 1; transition: color 0.15s; }
        .note-modal-close:hover { color: white; }
        .note-modal-body { padding: 18px; }
        .note-modal-job-ref { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-muted); margin-bottom: 10px; }
        .note-modal-text {
            font-size: 0.88rem; line-height: 1.65;
            color: var(--text-primary);
            background: var(--surface-2);
            border: 1px solid var(--border-light);
            border-radius: 6px; padding: 12px 14px;
            white-space: pre-wrap; word-break: break-word;
        }
        .note-modal-foot { padding: 12px 18px; border-top: 1px solid var(--border-light); display: flex; justify-content: flex-end; }
        .note-modal-btn {
            padding: 7px 20px; border-radius: 5px;
            border: 1px solid var(--border);
            background: var(--surface-3);
            color: var(--text-secondary);
            font-family: var(--font); font-size: 0.82rem; font-weight: 500;
            cursor: pointer; transition: all 0.15s;
        }
        .note-modal-btn:hover { background: var(--border); color: var(--text-primary); }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .filters-column ::-webkit-scrollbar-thumb { background: var(--navy-border); }
        .list-column ::-webkit-scrollbar-thumb { background: var(--navy-border); }

        @media (max-width: 1024px) {
            .filters-column { width: 220px; min-width: 220px; }
            .list-column { width: 35%; min-width: 220px; }
        }
        @media (max-width: 768px) {
            .filters-column { width: 180px; min-width: 180px; }
            .list-column { width: 40%; min-width: 180px; }
            .detail-header { flex-direction: column; align-items: stretch; gap: 6px; }
            .detail-header-left { flex-wrap: wrap; }
            .detail-header-right { flex-wrap: wrap; }
            .info-grid { grid-template-columns: 1fr; }
            .xy-grid { grid-template-columns: 1fr; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="topbar">
    <div class="topbar-brand">
        <div class="brand-logo">KB</div>
        <span class="brand-name">KAPPA BOLLE</span>
    </div>
    <div class="topbar-divider"></div>

    <label for="fileInput" class="topbar-btn btn-upload"><span>↑</span> Carica Excel</label>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">

    <div class="sheet-selector-wrap" id="sheetSelectorContainer">
        <label>Foglio:</label>
        <select id="sheetSelector"></select>
    </div>

    <button id="exportBtn" class="topbar-btn btn-export" disabled>⬇ Esporta con CHECK</button>
    <button id="autoBtn" class="topbar-btn btn-auto" onclick="toggleAutoRefresh()">▶️ Auto</button>
    <button id="popupBtn" class="topbar-btn btn-popup" onclick="openQuickPanel()">🪟 Pop-UP</button>

    <div class="topbar-status">
        <button id="statsBtn" class="topbar-btn btn-stats" disabled onclick="openStatsModal()">◫ Statistiche</button>
        <span id="statusPill" class="status-pill">Nessun file caricato</span>
    </div>
</div>

<div class="main-container">
    <div class="filters-column">
        <div class="filters-header">
            <div class="sidebar-title">Filtri</div>
            <div class="sidebar-month" id="fileName">—</div>
            <div class="job-count-row">
                <span class="job-count-badge" id="jobCount">0 job</span>
            </div>
        </div>
        <div class="filters-scroll">
            <div class="filter-row">
                <span class="filter-label">Ricerca</span>
                <input type="text" class="filter-input" id="searchText" placeholder="Job, impianto, indirizzo…" oninput="filterJobs()">
            </div>
            <hr class="filter-divider">
            <div class="filter-row">
                <span class="filter-label">Venditore</span>
                <select class="filter-select" id="filterVenditore" onchange="filterJobs()">
                    <option value="">Tutti</option>
                </select>
            </div>
            <div class="filter-row">
                <span class="filter-label">Contratto</span>
                <select class="filter-select" id="filterContract" onchange="filterJobs()">
                    <option value="">Tutti</option>
                </select>
            </div>
            <div class="filter-row">
                <span class="filter-label">Tipo lavoro</span>
                <select class="filter-select" id="filterWork" onchange="filterJobs()">
                    <option value="">Tutti</option>
                </select>
            </div>
            <div class="filter-row">
                <span class="filter-label">Stato</span>
                <select class="filter-select" id="filterCheck" onchange="filterJobs()">
                    <option value="">Tutti</option>
                    <option value="ok">Registrati (OK)</option>
                    <option value="nt">Non Trovati (NT)</option>
                    <option value="dv">Da Verificare (DV)</option>
                    <option value="empty">Da registrare</option>
                </select>
            </div>
            <div class="filter-row">
                <div class="filter-checkbox-row">
                    <input type="checkbox" id="filterCosto" onchange="filterJobs()">
                    <label for="filterCosto">Solo job con costo &gt; 0</label>
                </div>
            </div>
            <hr class="filter-divider">
            <div class="filter-row">
                <span class="filter-label">Ordina per</span>
                <select class="filter-select" id="filterSort" onchange="filterJobs()">
                    <option value="price-desc">Prezzo (decrescente) ↓</option>
                    <option value="price-asc">Prezzo (crescente) ↑</option>
                    <option value="date-desc">Data (più recente) ↓</option>
                    <option value="date-asc">Data (più vecchia) ↑</option>
                    <option value="job-asc">Nome Job (A→Z)</option>
                    <option value="job-desc">Nome Job (Z→A)</option>
                </select>
            </div>
            <button class="reset-btn" onclick="resetFilters()">↺ Reset filtri</button>
        </div>
    </div>

    <div class="list-column">
        <div class="list-header">
            <span class="list-header-title">📋 Job</span>
            <span class="list-header-count" id="listCount">0</span>
        </div>
        <div class="jobs-list-container" id="jobsListContainer">
            <div id="jobsList"></div>
        </div>
    </div>

    <div class="detail-column">
        <div class="detail-header">
            <div class="detail-header-left">
                <button class="nav-btn" id="prevJob" onclick="navigateJob(-1)" disabled>◀</button>
                <button class="nav-btn" id="nextJob" onclick="navigateJob(1)" disabled>▶</button>
                <div class="detail-job-title">
                    Job&nbsp;<strong id="selectedJob">—</strong>
                    <span class="job-status-badge" id="statusBadge">—</span>
                </div>
            </div>
            <div class="detail-header-right">
                <span class="worktype-tag" id="workTypeBadge"></span>
                <button class="register-btn" data-status="ok" onclick="handleSetStatus('ok')">⏳ Registra</button>
                <button class="register-btn" data-status="nt" onclick="handleSetStatus('nt')">🔍 Non Trovato</button>
                <button class="register-btn" data-status="dv" onclick="handleSetStatus('dv')">⚠️ Da Verificare</button>
            </div>
        </div>
        <div class="detail-body" id="detailContent">
            <div class="empty-state">
                <div class="empty-state-icon">📂</div>
                <h3>Seleziona un job dalla lista</h3>
                <p>Carica un file Excel per iniziare</p>
            </div>
        </div>
    </div>
</div>

<div id="noteModal" class="note-modal-overlay" style="display:none;">
    <div class="note-modal-box">
        <div class="note-modal-head">
            <h3>📝 Note del Job</h3>
            <button class="note-modal-close" onclick="closeNoteModal()">×</button>
        </div>
        <div class="note-modal-body">
            <div class="note-modal-job-ref" id="noteModalJobRef"></div>
            <div class="note-modal-text" id="noteModalText"></div>
        </div>
        <div class="note-modal-foot">
            <button class="note-modal-btn" onclick="closeNoteModal()">Chiudi</button>
        </div>
    </div>
</div>

<div id="statsModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <div class="modal-head">
            <h2>◫&nbsp; Statistiche Job</h2>
            <button class="modal-close-x" onclick="closeStatsModal()">×</button>
        </div>
        <div class="modal-body" id="statsContent"></div>
        <div class="modal-foot">
            <button class="modal-btn modal-btn-pdf" onclick="exportStatsPDF()">⬇ PDF</button>
            <button class="modal-btn modal-btn-xlsx" onclick="exportStatsExcel()">⬇ Excel Statistiche</button>
            <button class="modal-btn modal-btn-missing" onclick="exportMancantiExcel()">⬇ Job Mancanti</button>
            <button class="modal-btn modal-btn-close" onclick="closeStatsModal()">Chiudi</button>
        </div>
    </div>
</div>

<script src="put_in_app.js"></script>
</body>
</html>
